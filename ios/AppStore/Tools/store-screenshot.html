<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luzia Player — capturas para App Store</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      --gold: #f7bb58;
      position: relative;
      color: #fff9ed;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse 85% 40% at 82% 76%, rgba(123, 25, 52, .7), transparent 75%),
        radial-gradient(ellipse 70% 30% at 8% 9%, rgba(113, 30, 68, .62), transparent 80%),
        linear-gradient(155deg, #220919 0%, #3b0b20 48%, #130611 100%);
    }
    body::before {
      content: "";
      position: absolute;
      width: 1800px; height: 1800px;
      border: 2px solid rgba(255, 217, 157, .08);
      border-radius: 50%;
      right: -850px; top: 440px;
      box-shadow: 0 0 0 180px rgba(255, 217, 157, .022), 0 0 0 360px rgba(255, 217, 157, .018);
    }
    body::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(8, 2, 8, .64));
      pointer-events: none;
    }
    .top-rule { position: absolute; top: 0; left: 0; right: 0; height: 12px; background: linear-gradient(90deg, #9d4a42, #f4c570 48%, #9d4a42); }
    .content { position: relative; z-index: 2; padding: 104px 94px 0; }
    .brand { display: flex; align-items: center; gap: 24px; }
    .logo { width: 92px; height: 92px; border-radius: 25px; box-shadow: 0 18px 45px rgba(0,0,0,.34); }
    .brand-name { font-size: 39px; font-weight: 760; letter-spacing: -.8px; }
    .eyebrow { margin-top: 98px; color: var(--gold); font-size: 28px; font-weight: 760; letter-spacing: 6px; text-transform: uppercase; }
    h1 { max-width: 1030px; margin: 24px 0 0; font-size: 108px; line-height: .99; letter-spacing: -6px; font-weight: 800; text-wrap: balance; }
    h1 em { color: var(--gold); font-style: normal; }
    .subtitle { max-width: 970px; margin-top: 32px; color: rgba(255, 247, 231, .82); font-size: 39px; line-height: 1.2; letter-spacing: -.5px; }
    .device {
      position: absolute;
      z-index: 3;
      top: 880px; left: 50%; transform: translateX(-50%);
      width: 920px; padding: 13px;
      border-radius: 84px;
      background: linear-gradient(145deg, #a77866, #f1ca93 18%, #442032 50%, #c99867);
      box-shadow: 0 42px 100px rgba(0,0,0,.60), 0 0 0 7px rgba(255,255,255,.09);
      overflow: hidden;
    }
    .screen { display: block; width: 100%; border-radius: 72px; }
    body.ipad .content { padding: 115px 150px 0; }
    body.ipad .brand { gap: 30px; }
    body.ipad .logo { width: 112px; height: 112px; border-radius: 29px; }
    body.ipad .brand-name { font-size: 49px; }
    body.ipad .eyebrow { margin-top: 72px; font-size: 34px; }
    body.ipad h1 { max-width: 1750px; font-size: 145px; letter-spacing: -8px; }
    body.ipad .subtitle { max-width: 1550px; font-size: 52px; margin-top: 36px; }
    body.ipad .device { top: 940px; width: 1740px; border-radius: 75px; padding: 16px; }
    body.ipad .screen { border-radius: 59px; }
  </style>
</head>
<body>
  <div class="top-rule"></div>
  <main class="content">
    <div class="brand">
      <img class="logo" src="../../RadioLuzia/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt="">
      <div class="brand-name">Luzia Player</div>
    </div>
    <div class="eyebrow">PODCAST SANTA LUZIA</div>
    <h1 id="headline"></h1>
    <div class="subtitle" id="subtitle"></div>
  </main>
  <div class="device"><img class="screen" id="screen" alt="Tela real do aplicativo"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const platform = params.get('platform') === 'ipad' ? 'ipad' : 'iphone';
    const concept = Math.max(1, Math.min(3, Number(params.get('concept') || 1)));
    document.body.classList.add(platform);
    const concepts = {
      1: {
        capture: 'player',
        headline: 'Seu podcast,<br><em>sempre por perto.</em>',
        subtitle: 'Ouça os episódios da Programação Santa Luzia em um player feito para iPhone e iPad.'
      },
      2: {
        capture: 'episodes',
        headline: 'Escolha um<br><em>episódio.</em>',
        subtitle: 'Acesse o catálogo e comece a ouvir com um toque.'
      },
      3: {
        capture: 'details',
        headline: 'Ouça do<br><em>seu jeito.</em>',
        subtitle: 'Áudio em segundo plano, controles na tela bloqueada e saída por AirPlay.'
      }
    };
    const data = concepts[concept];
    document.getElementById('screen').src = `../Source/Captures/Current/${platform}-${data.capture}.png`;
    document.getElementById('headline').innerHTML = data.headline;
    document.getElementById('subtitle').textContent = data.subtitle;
  </script>
</body>
</html>
