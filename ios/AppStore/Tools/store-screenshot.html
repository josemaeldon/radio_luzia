<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      --gold: #ffb43f;
      --cream: #fff4dd;
      position: relative;
      background: #180713;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .background, .shade, .glow { position: absolute; inset: 0; }
    .background { width: 100%; height: 100%; object-fit: cover; }
    .shade { background: linear-gradient(180deg, rgba(10,0,9,.22), rgba(16,1,13,.42) 48%, rgba(8,0,7,.76)); }
    .glow { background: radial-gradient(circle at 50% 28%, rgba(255,183,61,.13), transparent 38%); }
    .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
    .brand { display: flex; align-items: center; gap: 20px; margin-top: 92px; z-index: 2; }
    .logo { width: 112px; height: 112px; border-radius: 27px; box-shadow: 0 18px 50px rgba(0,0,0,.42); }
    .brand-copy { display: flex; flex-direction: column; }
    .brand-name { font-size: 37px; font-weight: 750; letter-spacing: -.8px; }
    .brand-live { color: rgba(255,244,221,.72); font-size: 24px; margin-top: 6px; letter-spacing: .4px; }
    .brand-live::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 9px; border-radius: 50%; background: #28d765; box-shadow: 0 0 18px #28d765; }
    .copy { width: 88%; text-align: center; z-index: 2; margin-top: 62px; }
    h1 { margin: 0; font-size: 79px; line-height: .99; letter-spacing: -4.4px; font-weight: 820; text-wrap: balance; }
    .accent { color: var(--gold); }
    .subtitle { max-width: 1040px; margin: 28px auto 0; color: rgba(255,244,221,.82); font-size: 34px; line-height: 1.2; letter-spacing: -.7px; text-wrap: balance; }
    .feature-row { display: flex; justify-content: center; gap: 13px; margin-top: 28px; }
    .pill { padding: 12px 20px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(32,8,27,.44); backdrop-filter: blur(20px); color: rgba(255,244,221,.82); font-size: 19px; font-weight: 650; letter-spacing: .5px; }
    .device {
      position: absolute;
      top: 940px;
      width: 806px;
      padding: 13px;
      border-radius: 80px;
      background: linear-gradient(145deg, rgba(255,255,255,.48), rgba(255,255,255,.10) 30%, rgba(255,180,63,.25) 100%);
      box-shadow: 0 70px 140px rgba(0,0,0,.58), 0 0 90px rgba(255,180,63,.10);
      z-index: 2;
    }
    .screen { display: block; width: 100%; border-radius: 68px; }
    .glass-line { position: absolute; left: -12%; right: -12%; bottom: 8%; height: 290px; transform: rotate(-8deg); border-radius: 50%; background: rgba(255,255,255,.035); filter: blur(1px); border: 2px solid rgba(255,255,255,.05); }
    body.ipad .brand { margin-top: 74px; }
    body.ipad .logo { width: 120px; height: 120px; border-radius: 29px; }
    body.ipad .brand-name { font-size: 39px; }
    body.ipad .copy { margin-top: 46px; }
    body.ipad h1 { font-size: 92px; letter-spacing: -5px; max-width: 1500px; margin: auto; }
    body.ipad .subtitle { font-size: 36px; }
    body.ipad .feature-row { margin-top: 23px; }
    body.ipad .pill { font-size: 21px; padding: 13px 23px; }
    body.ipad .device { top: 690px; width: 1510px; border-radius: 74px; padding: 14px; }
    body.ipad .screen { border-radius: 60px; }
  </style>
</head>
<body>
  <img class="background" id="background" alt="">
  <div class="shade"></div><div class="glow"></div><div class="glass-line"></div>
  <main class="content">
    <div class="brand">
      <img class="logo" src="../../RadioLuzia/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt="">
      <div class="brand-copy"><span class="brand-name">Rádio Santa Luzia</span><span class="brand-live">AO VIVO</span></div>
    </div>
    <div class="copy">
      <h1 id="headline"></h1>
      <div class="subtitle" id="subtitle"></div>
      <div class="feature-row" id="features"></div>
    </div>
    <div class="device"><img class="screen" id="screen" alt="Interface do app"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const platform = params.get('platform') === 'ipad' ? 'ipad' : 'iphone';
    const concept = Math.max(1, Math.min(3, Number(params.get('concept') || 1)));
    document.body.classList.add(platform);
    const concepts = {
      1: {
        bg: 'concept-01-halo.png', capture: 'main.png',
        headline: 'A sua rádio,<br><span class="accent">sempre com você</span>',
        subtitle: 'Música, fé e comunidade ao vivo, em uma experiência feita para iPhone e iPad.',
        features: ['AO VIVO', 'AIRPLAY', 'SEGUNDO PLANO']
      },
      2: {
        bg: 'concept-02-realtime.png', capture: 'details.png',
        headline: 'Tudo em<br><span class="accent">tempo real</span>',
        subtitle: 'Capa, progresso, histórico e metadados completos atualizados via WebSocket.',
        features: ['WEBSOCKET', 'METADADOS', 'HISTÓRICO']
      },
      3: {
        bg: 'concept-03-requests.png', capture: 'requests.png',
        headline: 'Escolha o que<br><span class="accent">quer ouvir</span>',
        subtitle: 'Explore o repertório e envie seu pedido musical diretamente pelo app.',
        features: ['BUSCA RÁPIDA', 'CAPAS', 'PEDIDOS']
      }
    };
    const data = concepts[concept];
    document.getElementById('background').src = `../Source/Backgrounds/${data.bg}`;
    document.getElementById('screen').src = `../Source/Captures/${platform}-${data.capture}`;
    document.getElementById('headline').innerHTML = data.headline;
    document.getElementById('subtitle').textContent = data.subtitle;
    document.getElementById('features').innerHTML = data.features.map(item => `<span class="pill">${item}</span>`).join('');
  </script>
</body>
</html>
